name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write      # needed for GHCR push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mac

jobs:

  # ── Job 1: Build & push Docker image to GHCR ─────────────────────────────────
  docker:
    name: Docker image → ghcr.io
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Job 2: Build Windows installer .exe ──────────────────────────────────────
  installer:
    name: Windows installer .exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Patch version in installer script
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content mac-installer.iss -Raw) `
            -replace '#define AppVersion "[^"]*"', "#define AppVersion `"$ver`"" |
            Set-Content mac-installer.iss -NoNewline

      - name: Ensure required assets exist
        shell: pwsh
        run: |
          # logo.png already exists; create placeholder ico if missing
          if (-not (Test-Path "mac-logo.ico")) {
            Copy-Item "frontend\favicon.ico" "mac-logo.ico" -ErrorAction SilentlyContinue
          }
          # create empty download-models.bat if missing
          if (-not (Test-Path "download-models.bat")) {
            "@echo off`r`necho Models are bundled in Docker images — no manual download needed." |
              Out-File "download-models.bat" -Encoding ascii
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $url  = "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe"
          $dest = "$env:TEMP\issetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          Start-Process -FilePath $dest `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc mac-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $src = Get-ChildItem dist\*.exe | Select-Object -First 1
          if ($src) {
            Rename-Item $src.FullName "MAC-v$ver-Setup.exe" -ErrorAction SilentlyContinue
          }
          Get-ChildItem dist\

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.exe
          retention-days: 7

  # ── Job 3: Create GitHub Release with both artifacts ─────────────────────────
  release:
    name: GitHub Release
    needs: [docker, installer]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/

      - name: Write release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}"
          NOTES=$(awk "/^## \[?v?${VERSION}\]?/{found=1;next} /^## \[/{if(found)exit} found{print}" CHANGELOG.md 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
          NOTES="## MAC v${VERSION} — MBM AI Cloud

Self-hosted AI inference platform for MBM University, Jodhpur.
Run LLMs entirely on campus — zero cloud, zero cost.

---

### Quick Start — Host PC (Admin Server)

**Option A — Windows Installer (.exe)**
1. Download \`MAC-v${VERSION}-Setup.exe\` below
2. Run as Administrator → choose **Host**
3. Start MAC Server from desktop shortcut

**Option B — Docker pull**
\`\`\`bash
docker pull ${IMAGE}

# Copy docker-compose.yml from the repo, then:
docker compose up -d
\`\`\`

---

### Worker PC — Contribute your GPU

On any PC with NVIDIA GPU on the same WiFi:
1. Download \`MAC-v${VERSION}-Setup.exe\` → choose **Worker**
2. Or download \`setup-worker.bat\` from the running server:
   \`http://<server-ip>/api/v1/cluster/join/setup\`
3. Run as Administrator — follow the 9-step wizard
4. Admin approves the node in Admin Panel → Cluster → Nodes

---

### Docker Image
\`\`\`
${IMAGE}
\`\`\`

---

[WALKTHROUGH.md](https://github.com/${{ github.repository }}/blob/main/WALKTHROUGH.md) · [README](https://github.com/${{ github.repository }}/blob/main/README.md)"
          fi
          echo "$NOTES" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MAC v${{ steps.version.outputs.VERSION }} — MBM AI Cloud"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.exe
