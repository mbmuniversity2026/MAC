name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.1.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: write
  packages: write

jobs:

  # ── Windows installer ────────────────────────────────────────────────────────
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch version in .iss
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ github.event.inputs.version }}" }
          (Get-Content mac-installer.iss -Raw) -replace '#define AppVersion "[^"]*"', "#define AppVersion `"$ver`"" |
            Set-Content mac-installer.iss -NoNewline

      - name: Prepare assets
        shell: pwsh
        run: |
          if (-not (Test-Path "mac-logo.ico")) {
            Copy-Item "frontend\favicon.ico" "mac-logo.ico" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $dest = "$env:TEMP\issetup.exe"
          Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe" -OutFile $dest -UseBasicParsing
          Start-Process -FilePath $dest -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc mac-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename output
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Get-ChildItem dist\*.exe | Select-Object -First 1 |
            Rename-Item -NewName "MAC-v$ver-Setup.exe" -ErrorAction SilentlyContinue
          Get-ChildItem dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.exe
          retention-days: 7

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: "MAC ${{ github.ref_name }} — MBM AI Cloud"
          body: |
            ## MAC ${{ github.ref_name }} — MBM AI Cloud
            **MBM University, Jodhpur · OFF the LINE. Cross the Limits.**

            Self-hosted AI inference platform — runs entirely on campus LAN, zero cloud.

            ---

            ### Install — Host PC (Admin Server)

            **Option A — Windows Installer**
            1. Download `MAC-${{ github.ref_name }}-Setup.exe` below
            2. Run as Administrator → choose **Host**
            3. Launch from desktop shortcut

            **Option B — Docker**
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/mac:${{ github.ref_name }}
            ```
            Copy `docker-compose.yml` from the repo and run `docker compose up -d`.

            ---

            ### Worker PC — GPU contribution

            Download `setup-worker.bat` from the running server:
            ```
            http://<server-ip>/api/v1/cluster/join/setup
            ```
            Or download `MAC-${{ github.ref_name }}-Setup.exe` → choose **Worker**.

            ---

            ### Docker images (GHCR)
            ```bash
            # MAC API server
            docker pull ghcr.io/mbmuniversity2026/mac:latest

            # MBM Book workspace (per-user IDE containers)
            docker pull ghcr.io/mbmuniversity2026/mac-workspace:latest

            # Worker agent (GPU satellite nodes)
            docker pull ghcr.io/mbmuniversity2026/mac-worker:latest
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.exe
