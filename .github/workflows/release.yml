name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:

  # ── Docker image → ghcr.io ───────────────────────────────────────────────────
  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mac:latest
            ghcr.io/${{ github.repository_owner }}/mac:${{ github.ref_name }}

  # ── Windows installer ────────────────────────────────────────────────────────
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch version in .iss
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content mac-installer.iss -Raw) -replace '#define AppVersion "[^"]*"', "#define AppVersion `"$ver`"" |
            Set-Content mac-installer.iss -NoNewline

      - name: Prepare assets
        shell: pwsh
        run: |
          if (-not (Test-Path "mac-logo.ico")) {
            Copy-Item "frontend\favicon.ico" "mac-logo.ico" -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "download-models.bat")) {
            "@echo off`r`necho Models are included in Docker images." | Out-File "download-models.bat" -Encoding ascii
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $dest = "$env:TEMP\issetup.exe"
          Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe" -OutFile $dest -UseBasicParsing
          Start-Process -FilePath $dest -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc mac-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename output
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Get-ChildItem dist\*.exe | Select-Object -First 1 |
            Rename-Item -NewName "MAC-v$ver-Setup.exe" -ErrorAction SilentlyContinue
          Get-ChildItem dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.exe
          retention-days: 7

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [docker, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: "MAC ${{ github.ref_name }} — MBM AI Cloud"
          body: |
            ## MAC ${{ github.ref_name }} — MBM AI Cloud
            **MBM University, Jodhpur · OFF the LINE. Cross the Limits.**

            Self-hosted AI inference platform — runs entirely on campus LAN, zero cloud.

            ---

            ### Install — Host PC (Admin Server)

            **Option A — Windows Installer**
            1. Download `MAC-${{ github.ref_name }}-Setup.exe` below
            2. Run as Administrator → choose **Host**
            3. Launch from desktop shortcut

            **Option B — Docker**
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/mac:${{ github.ref_name }}
            ```
            Copy `docker-compose.yml` from the repo and run `docker compose up -d`.

            ---

            ### Worker PC — GPU contribution

            Download `setup-worker.bat` from the running server:
            ```
            http://<server-ip>/api/v1/cluster/join/setup
            ```
            Or download `MAC-${{ github.ref_name }}-Setup.exe` → choose **Worker**.

            ---

            ### Docker image
            ```
            ghcr.io/${{ github.repository_owner }}/mac:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mac:latest
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.exe
