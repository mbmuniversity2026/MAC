# ═══════════════════════════════════════════════════════════════════════════════
#  MAC Worker Node — GPU Inference + Worker Agent
#  MBM AI Cloud · MBM University, Jodhpur
#
#  SETUP (worker PC):
#    1. Clone repo:  git clone https://github.com/mbmuniversity2026/MAC.git
#    2. Copy env:    copy .env.worker.example .env.worker
#    3. Edit:        notepad .env.worker   (set HOST_URL, ENROLL_TOKEN, MODEL)
#    4. Run:         docker compose -f docker-compose.worker.yml --env-file .env.worker up -d
#    5. Admin approves the node in MAC Admin → Cluster panel
#
#  OR use the setup script:
#    Windows:  setup-worker.bat
#
# ── Recommended models (set VLLM_MODEL) ───────────────────────────────────────
#  Gemma 3 4B (default)       google/gemma-3-4b-it            ~8 GB fp16
#  Gemma 3 4B AWQ             mlabonne/gemma-3-4b-it-AWQ      ~4 GB AWQ
#  Mistral 7B AWQ             solidrust/Mistral-7B-Instruct-v0.3-AWQ  ~4.5 GB
#  Qwen 2.5 7B AWQ            Qwen/Qwen2.5-7B-Instruct-AWQ    ~5 GB
#  DeepSeek R1 7B (4-bit bnb)  deepseek-ai/DeepSeek-R1-Distill-Qwen-7B    ~4 GB
#  Qwen 2.5 Coder 7B AWQ      Qwen/Qwen2.5-Coder-7B-Instruct-AWQ ~5 GB
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── vLLM GPU inference ──────────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: mac-worker-vllm
    ports:
      - "${VLLM_PORT:-8001}:${VLLM_PORT:-8001}"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-mlabonne/gemma-3-4b-it-AWQ}
      --port ${VLLM_PORT:-8001}
      --gpu-memory-utilization ${VLLM_GPU_MEM:-0.85}
      --max-model-len ${VLLM_MAX_LEN:-8192}
      --trust-remote-code
      --dtype ${VLLM_DTYPE:-auto}
      --served-model-name ${VLLM_SERVED_NAME:-gemma-3-4b}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VLLM_PORT:-8001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mac-worker-net

  # ── MAC Worker Agent ─────────────────────────────────────────────────────────
  # Registers this PC with the MAC host and sends live heartbeats.
  # Pre-built image — no local build needed.
  worker-agent:
    image: ${MAC_WORKER_IMAGE:-ghcr.io/mbmuniversity2026/mac-worker:latest}
    container_name: mac-worker-agent
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_started
    environment:
      - MAC_MASTER_URL=${MAC_MASTER_URL}
      - MAC_ENROLL_TOKEN=${MAC_ENROLL_TOKEN}
      - MAC_WORKER_NAME=${MAC_WORKER_NAME:-worker-pc}
      - MAC_WORKER_IP=${MAC_WORKER_IP:-}
      - MAC_VLLM_PORT=${VLLM_PORT:-8001}
      - MAC_VLLM_MODEL=${VLLM_MODEL:-mlabonne/gemma-3-4b-it-AWQ}
      - MAC_VLLM_URL=http://vllm:${VLLM_PORT:-8001}
      - MAC_GPU_NAME=${MAC_GPU_NAME:-}
      - MAC_GPU_VRAM_MB=${MAC_GPU_VRAM_MB:-0}
      - MAC_HEARTBEAT_SEC=${MAC_HEARTBEAT_SEC:-10}
      - MAC_ENGINE=vllm
      - MAC_STATE_FILE=/data/mac_worker_state.json
    volumes:
      - worker-state:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - mac-worker-net

volumes:
  hf-cache:
  worker-state:

networks:
  mac-worker-net:
    driver: bridge
