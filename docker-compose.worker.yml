# ═══════════════════════════════════════════════════════════════════════════════
#  MAC Worker Node — vLLM GPU Inference
#  MBM AI Cloud · MBM University, Jodhpur
#
#  worker_agent.py runs directly on the host (see setup-worker.bat)
#  This file only manages the vLLM inference container.
#
#  Models (set VLLM_MODEL in .env.worker):
#    Qwen/Qwen2.5-Coder-7B-Instruct-AWQ   Programming / Code
#    deepseek-ai/DeepSeek-R1-Distill-Qwen-7B  Logic / Math
#    Qwen/Qwen2.5-7B-Instruct-AWQ         General Chat
#    meta-llama/Llama-3.1-8B-Instruct     General Education
#    mistralai/Mistral-7B-Instruct-v0.3   Creative Writing
# ═══════════════════════════════════════════════════════════════════════════════

services:

  vllm:
    image: vllm/vllm-openai:latest
    container_name: mac-worker-vllm
    ports:
      - "${VLLM_PORT:-8001}:${VLLM_PORT:-8001}"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --port ${VLLM_PORT:-8001}
      --gpu-memory-utilization ${VLLM_GPU_MEM:-0.88}
      --max-model-len ${VLLM_MAX_LEN:-4096}
      --trust-remote-code
      --dtype auto
      --served-model-name ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VLLM_PORT:-8001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  hf-cache:
