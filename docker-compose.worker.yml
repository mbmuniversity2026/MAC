# ═══════════════════════════════════════════════════════════════════════════════
#  MAC Worker Node — vLLM GPU Inference + Worker Agent
#  MBM AI Cloud · MBM University, Jodhpur
#
#  Usage (after filling .env.worker):
#    docker compose -f docker-compose.worker.yml --env-file .env.worker up -d
#
#  OR pull pre-built image from ghcr.io (no build needed on worker PC):
#    Set MAC_WORKER_IMAGE=ghcr.io/mbmuniversity2026/mac-worker:latest in .env.worker
#
#  Recommended AWQ models (set VLLM_MODEL in .env.worker):
#    solidrust/Mistral-7B-Instruct-v0.3-AWQ   Creative/Chat    (~4.5 GB, AWQ)
#    Qwen/Qwen2.5-7B-Instruct-AWQ             General Chat     (~5 GB,   AWQ)
#    Qwen/Qwen2.5-Coder-7B-Instruct-AWQ       Programming      (~5 GB,   AWQ)
#    deepseek-ai/DeepSeek-R1-Distill-Qwen-7B  Math/Reasoning   (~8 GB,   fp16)
#    Qwen/Qwen2-VL-7B-Instruct                Vision/Images    (~8 GB,   fp16)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── vLLM GPU inference ──────────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: mac-worker-vllm
    ports:
      - "${VLLM_PORT:-8001}:${VLLM_PORT:-8001}"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_DATASETS_OFFLINE=${HF_DATASETS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-solidrust/Mistral-7B-Instruct-v0.3-AWQ}
      --port ${VLLM_PORT:-8001}
      --gpu-memory-utilization ${VLLM_GPU_MEM:-0.85}
      --max-model-len ${VLLM_MAX_LEN:-8192}
      --trust-remote-code
      --dtype ${VLLM_DTYPE:-auto}
      --served-model-name ${VLLM_SERVED_NAME:-${VLLM_MODEL:-solidrust/Mistral-7B-Instruct-v0.3-AWQ}}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VLLM_PORT:-8001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mac-worker-net

  # ── MAC Worker Agent ─────────────────────────────────────────────────────────
  # Registers this PC with the MAC host and sends live heartbeats.
  # Uses pre-built image from ghcr.io — no build step needed on worker PC.
  worker-agent:
    image: ${MAC_WORKER_IMAGE:-ghcr.io/mbmuniversity2026/mac-worker:latest}
    container_name: mac-worker-agent
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_started
    environment:
      - MAC_MASTER_URL=${MAC_MASTER_URL:-https://10.10.12.115}
      - MAC_ENROLL_TOKEN=${MAC_ENROLL_TOKEN}
      - MAC_WORKER_NAME=${MAC_WORKER_NAME:-worker-pc}
      - MAC_WORKER_IP=${MAC_WORKER_IP:-}
      - MAC_VLLM_PORT=${VLLM_PORT:-8001}
      - MAC_VLLM_MODEL=${VLLM_MODEL:-solidrust/Mistral-7B-Instruct-v0.3-AWQ}
      - MAC_VLLM_URL=http://vllm:${VLLM_PORT:-8001}
      - MAC_GPU_NAME=${MAC_GPU_NAME:-}
      - MAC_GPU_VRAM_MB=${MAC_GPU_VRAM_MB:-0}
      - MAC_HEARTBEAT_SEC=${MAC_HEARTBEAT_SEC:-10}
      - MAC_ENGINE=vllm
      - MAC_STATE_FILE=/data/mac_worker_state.json
    volumes:
      - worker-state:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - mac-worker-net

volumes:
  hf-cache:
  worker-state:

networks:
  mac-worker-net:
    driver: bridge
