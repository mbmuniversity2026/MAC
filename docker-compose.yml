# ═══════════════════════════════════════════════════════════
#  MAC — MBM AI Cloud  |  Host Server  (RTX 3060 12 GB)
# ═══════════════════════════════════════════════════════════
#  GPU budget (12 GB):
#    Qwen2.5-7B-AWQ  (voice / chat LLM)  ≈ 5 GB   — vllm 0.85 util, ctx 2048, awq_marlin
#    Veena TTS  (3B, 4-bit)              ≈ 2 GB   — always-on
#    Whisper STT (CPU)                   ≈ 0 GB VRAM
#    Headroom / OS                       ≈ 5 GB   ✓
#
#  Start:   start-mac.bat   (auto-detects GPU → adds --profile gpu)
#  Stop:    stop-mac.bat
# ═══════════════════════════════════════════════════════════

services:

  # ── MAC API Server ──────────────────────────────────────
  mac:
    build: .
    container_name: mac-api
    ports:
      - "${APP_HOST:-0.0.0.0}:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://mac:mac_password@postgres:5432/mac_db
      - REDIS_URL=redis://redis:6379/0
      - VLLM_BASE_URL=http://vllm-speed:8001
      - VLLM_SPEED_URL=http://vllm-speed:8001
      - VLLM_CODE_URL=http://vllm-speed:8001
      - VLLM_REASONING_URL=http://vllm-reason:8003
      - VLLM_INTELLIGENCE_URL=http://vllm-reason:8003
      - WHISPER_URL=http://whisper:8000
      - TTS_URL=http://tts:8000
      - EMBEDDING_URL=http://vllm-speed:8001
      - QDRANT_URL=http://qdrant:6333
      - SEARXNG_URL=http://searxng:8080
      - MAC_ENABLED_MODELS=qwen2.5:7b,deepseek-r1:7b,whisper-small,veena-tts
      - MAC_AUTO_FALLBACK=qwen2.5:7b
      - INSIGHTFACE_HOME=/opt/insightface_models
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.35}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_DATASETS_OFFLINE=${HF_DATASETS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data/uploads/copy_check:/app/uploads/copy_check
      - ./data/uploads/rag:/app/uploads/rag
      - ./data/uploads/attendance:/app/uploads/attendance
      - ./data/uploads/fileshare:/app/uploads/fileshare
      - ./data/uploads/syllabus:/app/uploads/syllabus
      - ./data/uploads/model_weights:/app/uploads/model_weights
      - /var/run/docker.sock:/var/run/docker.sock  # MBM Book: spawn per-user workspace containers
    shm_size: '2gb'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  # ═══════════════════════════════════════════════════════
  #  vLLM — Qwen2.5-7B-AWQ  (fast chat + voice LLM)
  # ═══════════════════════════════════════════════════════
  # Start with: docker compose --profile gpu up -d
  # Without GPU: MAC runs in API-key-only + external-key mode.
  #
  # GPU memory: ~5 GB (AWQ quantised).  Runs GPU-only — no CPU fallback.
  # Enforce: NVIDIA_VISIBLE_DEVICES ensures the OCI runtime exposes the GPU.
  #
  # Legacy Docker Desktop (Windows): uncomment `runtime: nvidia` and remove
  # the deploy.resources block if vLLM fails to see the GPU.
  # GPU budget split: Qwen ~40% (~4.8 GB) + DeepSeek ~40% (~4.8 GB) = ~9.6 GB / 12 GB
  vllm-speed:
    image: vllm/vllm-openai:latest
    container_name: mac-vllm-speed
    profiles: ["gpu"]
    ports:
      - "${VLLM_SPEED_PORT:-8001}:${VLLM_SPEED_PORT:-8001}"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_SPEED_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --port ${VLLM_SPEED_PORT:-8001}
      --gpu-memory-utilization ${VLLM_SPEED_GPU_MEM:-0.42}
      --max-model-len ${VLLM_SPEED_MAX_LEN:-4096}
      --trust-remote-code
      --dtype auto
      --served-model-name ${VLLM_SPEED_SERVED_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VLLM_SPEED_PORT:-8001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  # ═══════════════════════════════════════════════════════
  #  vLLM — DeepSeek-R1-Distill-Qwen-7B (4-bit AWQ)
  #  Reasoning / deep-thinking model alongside Qwen chat
  #  GPU: ~4.8 GB at 42% utilization
  # ═══════════════════════════════════════════════════════
  vllm-reason:
    image: vllm/vllm-openai:latest
    container_name: mac-vllm-reason
    profiles: ["gpu"]
    ports:
      - "${VLLM_REASON_PORT:-8003}:${VLLM_REASON_PORT:-8003}"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_REASON_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-7B}
      --port ${VLLM_REASON_PORT:-8003}
      --gpu-memory-utilization ${VLLM_REASON_GPU_MEM:-0.42}
      --max-model-len ${VLLM_REASON_MAX_LEN:-4096}
      --trust-remote-code
      --quantization bitsandbytes
      --load-format bitsandbytes
      --dtype float16
      --served-model-name ${VLLM_REASON_SERVED_NAME:-deepseek-r1-7b}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VLLM_REASON_PORT:-8003}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  # ═══════════════════════════════════════════════════════
  #  SPEECH SERVICES
  # ═══════════════════════════════════════════════════════

  # ── Whisper STT (CPU — saves GPU for LLM + TTS) ────────
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: mac-whisper
    ports:
      - "${WHISPER_PORT:-8005}:8000"
    environment:
      - WHISPER__MODEL=${WHISPER_MODEL:-Systran/faster-whisper-small}
      - WHISPER__DEVICE=cpu
      - HUGGINGFACE_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  # ── Veena TTS — Hindi/English neural voice (maya-research/Veena) ──
  # Builds locally from ./veena_tts/. Downloads model weights on first run.
  # With GPU: 4-bit, ~2 GB VRAM.  Without GPU: CPU inference (slower).
  tts:
    build: ./veena_tts
    container_name: mac-tts
    ports:
      - "${TTS_PORT:-8006}:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VEENA_MODEL=${VEENA_MODEL:-maya-research/Veena}
      - VEENA_DEVICE=${VEENA_DEVICE:-auto}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_DATASETS_OFFLINE=${HF_DATASETS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  # ═══════════════════════════════════════════════════════
  #  INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: mac-postgres
    environment:
      POSTGRES_USER: mac
      POSTGRES_PASSWORD: mac_password
      POSTGRES_DB: mac_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mac -d mac_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: mac-pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5051}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-mac.admin@mbm.ac.in}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-ChangeThisStrongPassword!}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - mac-net

  redis:
    image: redis:7-alpine
    container_name: mac-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  nginx:
    image: nginx:alpine
    container_name: mac-nginx
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-80}:80"
      - "${APP_HOST:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend:/app:ro
    depends_on:
      mac:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mac-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  searxng:
    image: searxng/searxng:latest
    container_name: mac-searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:rw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - mac-net

  # ── MAC Watchdog ─────────────────────────────────────────────
  # Monitors all containers, fixes docker socket perms, reloads nginx
  watchdog:
    image: python:3.11-slim
    container_name: mac-watchdog
    restart: unless-stopped
    volumes:
      - ./watchdog.py:/app/watchdog.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog.log:/app/watchdog.log
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    working_dir: /app
    entrypoint: >
      sh -c "apt-get update -qq 2>/dev/null; apt-get install -y -qq docker.io 2>/dev/null || true; python watchdog.py"
    environment:
      - DOCKER_API_VERSION=1.43
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - mac-net

volumes:
  pgdata:
  pgadmin-data:
  redisdata:
  qdrantdata:
  hf-cache:             # Shared HuggingFace model cache (vLLM + Veena + Whisper)
  tts-voices:

networks:
  mac-net:
    driver: bridge
