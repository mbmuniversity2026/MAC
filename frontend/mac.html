<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBM · MAC Globe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif}

/* ── Layout ─────────────────────────────────────── */
#app{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(8px,2vw,28px);
}

/* Globe wrapper — scales with viewport */
#globe-scene{
  position:relative;
  width:var(--gs);height:var(--gs);
  flex-shrink:0;
}
#aura{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:78%;height:78%;
  border-radius:50%;
  box-shadow:
    0 0 24px 8px rgba(220,220,220,.18),
    0 0 50px 20px rgba(180,180,180,.09),
    0 0 80px 35px rgba(120,120,120,.05);
  pointer-events:none;z-index:0;
}
#gl{position:absolute;top:0;left:0;z-index:1}

/* Morph wrapper */
#morph-wrap{
  position:relative;
  width:var(--mw);height:var(--mh);
  background:#0e0d0c;
  border-radius:10px;
  overflow:hidden;
  flex-shrink:0;
}
#morph-sub{
  position:absolute;bottom:13%;left:0;right:0;
  text-align:center;opacity:0;
  transition:opacity 1.2s ease;
  font-family:Georgia,serif;
  font-size:clamp(8px,1.2vw,12px);
  letter-spacing:.3em;color:rgba(255,255,255,.25);
}
#morph-skip{
  position:absolute;bottom:5%;right:4%;
  font-size:clamp(8px,1.1vw,11px);
  color:rgba(255,255,255,.15);
  cursor:pointer;letter-spacing:.08em;
}

/* Landscape: side by side */
@media(orientation:landscape) and (min-aspect-ratio:4/3){
  #app{flex-direction:row;gap:clamp(12px,3vw,48px)}
}
</style>
</head>
<body>
<div id="app">
  <div id="globe-scene"><div id="aura"></div></div>
  <div id="morph-wrap">
    <canvas id="mc"></canvas>
    <div id="morph-sub">MBM AI CLOUD · OFF THE LINE</div>
    <div id="morph-skip" onclick="skipAll()">skip</div>
  </div>
</div>

<!-- Three.js (only external dep, ~600KB, CDN cached) -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
/* ══════════════════════════════════════════════════
   RESPONSIVE SIZING
══════════════════════════════════════════════════ */
function computeSizes(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const isLandscape = vw/vh > 4/3;
  let gs, mw, mh;
  if(isLandscape){
    // side by side
    gs = Math.round(Math.min(vh*0.82, vw*0.40));
    mh = Math.round(Math.min(vh*0.55, gs*0.65));
    mw = Math.round(mh * 1.9);
    if(mw > vw*0.52){ mw=Math.round(vw*0.52); mh=Math.round(mw/1.9); }
  } else {
    // stacked
    gs = Math.round(Math.min(vw*0.70, vh*0.48));
    mw = Math.round(Math.min(vw*0.92, 560));
    mh = Math.round(mw * 0.53);
    if(gs + mh + 40 > vh){ gs=Math.round((vh-mh-40)*0.95); }
  }
  document.documentElement.style.setProperty('--gs', gs+'px');
  document.documentElement.style.setProperty('--mw', mw+'px');
  document.documentElement.style.setProperty('--mh', mh+'px');
  return {gs,mw,mh};
}
let {gs,mw,mh} = computeSizes();

/* ══════════════════════════════════════════════════
   GLOBE
══════════════════════════════════════════════════ */
function ll2px(lon,lat,W,H){return[(lon+180)/360*W,(90-lat)/180*H]}

function prepImg(src,size){
  const t=document.createElement('canvas');
  t.width=t.height=size;
  const x=t.getContext('2d');
  x.filter='grayscale(1) brightness(1.35) contrast(1.12)';
  x.drawImage(src,0,0,size,size);
  return t;
}

function buildTexture(logo,person,alok){
  const W=512,H=256; // half-res for speed; still looks sharp on globe
  const cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');

  ctx.fillStyle='#b4b4b0';ctx.fillRect(0,0,W,H);

  // grid
  ctx.lineWidth=.5;ctx.strokeStyle='rgba(200,200,200,.20)';
  for(let la=-75;la<=75;la+=15){const[,y]=ll2px(0,la,W,H);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let lo=-165;lo<=165;lo+=15){const[x]=ll2px(lo,0,W,H);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

  // continents
  ctx.lineWidth=.8;ctx.lineJoin='round';
  ctx.fillStyle='rgba(238,236,230,.78)';ctx.strokeStyle='rgba(255,255,252,.90)';
  function poly(pts){ctx.beginPath();pts.forEach(([lo,la],i)=>{const[x,y]=ll2px(lo,la,W,H);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.closePath();ctx.fill();ctx.stroke();}
  poly([[-167,70],[-140,62],[-110,60],[-85,55],[-65,47],[-55,48],[-64,44],[-75,35],[-82,25],[-88,16],[-85,10],[-78,8],[-105,18],[-118,30],[-120,33],[-124,48],[-130,54],[-150,60],[-167,70]]);
  poly([[-68,83],[-20,83],[-18,76],[-25,68],[-44,60],[-57,64],[-68,83]]);
  poly([[-78,12],[-62,12],[-50,2],[-35,-5],[-35,-22],[-48,-28],[-52,-33],[-55,-38],[-64,-55],[-68,-55],[-65,-40],[-62,-20],[-70,-5],[-80,0],[-78,12]]);
  poly([[-10,36],[35,36],[35,42],[28,45],[30,48],[20,55],[25,65],[15,69],[5,62],[-5,48],[-10,36]]);
  poly([[-6,50],[2,51],[2,58],[-5,58],[-6,50]]);
  poly([[-18,16],[-18,8],[-15,5],[-8,4],[2,5],[10,4],[18,2],[30,-2],[40,10],[50,12],[55,0],[50,-25],[34,-35],[18,-35],[8,-5],[12,4],[-16,10],[-18,16]]);
  poly([[26,42],[35,36],[60,22],[78,8],[100,2],[104,1],[115,5],[125,22],[122,32],[130,45],[140,44],[145,50],[145,60],[135,68],[120,73],[100,78],[80,78],[60,73],[40,73],[30,70],[26,68],[26,42]]);
  poly([[62,22],[80,8],[88,22],[78,36],[62,22]]);
  poly([[96,22],[110,5],[120,15],[108,20],[96,22]]);
  poly([[130,31],[132,34],[136,36],[141,44],[141,31],[130,31]]);
  poly([[114,-22],[122,-18],[132,-12],[145,-15],[150,-22],[155,-32],[150,-40],[145,-40],[135,-34],[124,-34],[114,-28],[114,-22]]);
  poly([[166,-45],[172,-34],[174,-38],[170,-45],[166,-45]]);

  // image slot size = 45% of H (smaller = less "bulge")
  const IS = Math.round(H*0.45);
  const iy = Math.round((H-IS)/2);

  function blendImg(tmp,ox,oy,sz){
    ctx.save();ctx.globalAlpha=.87;ctx.globalCompositeOperation='source-over';
    ctx.drawImage(tmp,ox,oy,sz,sz);ctx.restore();
  }

  // Logo u=0.25
  blendImg(prepImg(logo,IS), Math.round(W*.25-IS/2), iy, IS);
  // Abhisek u=0.75
  blendImg(prepImg(person,IS), Math.round(W*.75-IS/2), iy, IS);
  // Alok u=0/1 seam — SMALLER (38%) so face doesn't bulge
  const AS = Math.round(H*0.38);
  const ay = Math.round((H-AS)/2);
  const ap = prepImg(alok,AS);
  blendImg(ap, -Math.round(AS/2), ay, AS);
  blendImg(ap, Math.round(W-AS/2), ay, AS);

  // MAC text
  ctx.save();ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=10;
  ctx.fillStyle='rgba(12,12,12,.92)';
  ctx.font='bold '+Math.round(H*.26)+'px "Arial Black",Arial,sans-serif';
  ctx.fillText('MAC',W*.5,H*.5);
  ctx.restore();

  return cv;
}

/* Three.js */
const wrap=document.getElementById('globe-scene');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(gs,gs);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0,0);
renderer.domElement.id='gl';
wrap.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,1,.1,100);
camera.position.z=2.5;

scene.add(new THREE.AmbientLight(0xffffff,1.1));
const kl=new THREE.DirectionalLight(0xffffff,1.2);kl.position.set(3,2.5,3);scene.add(kl);
const fl=new THREE.DirectionalLight(0xffffff,.5);fl.position.set(-2,-1,2);scene.add(fl);
const rl=new THREE.DirectionalLight(0xffffff,.4);rl.position.set(0,1,-3);scene.add(rl);

function makeRing(r,tx,tz,op){
  const pts=[];
  for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0));}
  const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:op}));
  line.rotation.x=tx;line.rotation.z=tz;return line;
}
const sg=new THREE.Group();
const RINGS=[
  {r:1.10,tx:Math.PI*.10,tz:0,           op:.70,spd: 1.5},
  {r:1.14,tx:Math.PI*.35,tz:Math.PI*.18, op:.55,spd:-1.0},
  {r:1.18,tx:Math.PI*.55,tz:-Math.PI*.25,op:.62,spd: 1.9},
  {r:1.12,tx:Math.PI*.70,tz:Math.PI*.08, op:.45,spd:-1.4},
  {r:1.16,tx:Math.PI*.20,tz:-Math.PI*.40,op:.38,spd: 2.2},
  {r:1.09,tx:Math.PI*.85,tz:Math.PI*.55, op:.30,spd:-.8},
];
RINGS.forEach(d=>{const rr=makeRing(d.r,d.tx,d.tz,d.op);rr.userData.spd=d.spd;sg.add(rr);});
scene.add(sg);

(function makeHalo(){
  const n=80,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,j=(Math.random()-.5)*.06;pos[i*3]=Math.cos(a)*(1.22+j);pos[i*3+1]=(Math.random()-.5)*.08;pos[i*3+2]=Math.sin(a)*(1.22+j);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const halo=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.028,transparent:true,opacity:.55,sizeAttenuation:true}));
  scene.add(halo);
  window._halo=halo;
})();

let sphere;
const geoS=new THREE.SphereGeometry(1,64,64);
let lImg=null,pImg=null,aImg=null,cnt=0;

function lerp(a,b,t){return{r:a.r+(b.r-a.r)*t,g:a.g+(b.g-a.g)*t,b:a.b+(b.b-a.b)*t};}
function toCSS(c,a=1){return`rgba(${Math.round(c.r)},${Math.round(c.g)},${Math.round(c.b)},${a})`;}

function getTextPx(text,fs,cW,cH,step=5){
  const off=document.createElement('canvas');off.width=cW;off.height=cH;
  const c=off.getContext('2d');c.fillStyle='#fff';
  c.font=`700 ${fs}px Georgia,'Times New Roman',serif`;
  c.textAlign='center';c.textBaseline='middle';c.fillText(text,cW/2,cH/2);
  const d=c.getImageData(0,0,cW,cH).data,pts=[];
  for(let y=0;y<cH;y+=step)for(let x=0;x<cW;x+=step)if(d[(y*cW+x)*4+3]>100)pts.push({x,y});
  return pts;
}
function sample(pts,n){const r=[],s=pts.length/n;for(let i=0;i<n;i++)r.push(pts[Math.floor(i*s)%pts.length]);return r;}

const N=420;
const FS=Math.round(H*.50);
const mbmPts=sample(getTextPx('MBM',FS,W,H,5),N);
const macPts=sample(getTextPx('MAC',FS,W,H,5),N);

class P{
  constructor(i){
    this.m=mbmPts[i];this.c=macPts[i];
    const a=Math.random()*Math.PI*2,d=120+Math.random()*160;
    this.x=W/2+Math.cos(a)*d;this.y=H/2+Math.sin(a)*d;
    this.vx=(Math.random()-.5)*5;this.vy=(Math.random()-.5)*5;
    this.delay=10+Math.random()*60;
    this.fs=5+Math.random()*5;
    this.ch=CHARS[Math.floor(Math.random()*CHARS.length)];
    this.rot=(Math.random()-.5)*1.2;this.rv=(Math.random()-.5)*.08;
    this.sp=.042+Math.random()*.028;this.fr=.80+Math.random()*.08;
    this.ct=0;this.ph=0;this.mt=0;this.md=Math.random()*40;this.settled=false;
  }
  getT(mt){return{x:this.m.x+(this.c.x-this.m.x)*mt,y:this.m.y+(this.c.y-this.m.y)*mt};}
  update(frame,morphing,mf){
    if(frame<this.delay)return;
    this.ph=Math.min(1,this.ph+.025);
    if(morphing&&mf>this.md)this.mt=Math.min(1,this.mt+.032); // faster morph
    const t=this.getT(this.mt);
    const fx=(t.x-this.x)*this.sp,fy=(t.y-this.y)*this.sp;
    this.vx=(this.vx+fx)*this.fr;this.vy=(this.vy+fy)*this.fr;
    this.x+=this.vx;this.y+=this.vy;
    this.rot+=this.rv;this.rv*=.88;
    this.ct=Math.min(1,this.ct+.011);
    const dx=this.x-t.x,dy=this.y-t.y;
    this.settled=Math.sqrt(dx*dx+dy*dy)<1.5&&Math.abs(this.vx)<.4;
  }
  draw(gmt){
    let col=gmt<.15?lerp(WHITE,PINK,Math.min(1,this.ct*1.8)):gmt<.85?lerp(PINK,ACCENT,(gmt-.15)/.7):ACCENT;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot*(1-this.mt*.85));
    ctx.font=`${this.fs}px 'Noto Sans Devanagari','Mangal',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=toCSS(col,.38+this.ph*.62);ctx.fillText(this.ch,0,0);ctx.restore();
  }
}

const parts=[];for(let i=0;i<N;i++)parts.push(new P(i));
let frame=0,phase=0,pf=0,morphing=false,mf=0,subShown=false,rafId;
function avgMT(){return parts.reduce((s,p)=>s+p.mt,0)/N;}

function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0e0d0c';ctx.fillRect(0,0,W,H);
  const settled=parts.filter(p=>p.settled).length,gmt=avgMT();
  for(const p of parts){p.update(frame,morphing,mf);p.draw(gmt);}
  if(morphing)mf++;
  if(phase===0){if(settled>N*.82){phase=1;pf=0;}}
  else if(phase===1){pf++;if(pf>80){phase=2;morphing=true;pf=0;}}   // shorter hold
  else if(phase===2){pf++;if(gmt>.96){phase=3;pf=0;}}
  else if(phase===3){
    pf++;
    if(!subShown&&pf>20){subShown=true;document.getElementById('morph-sub').style.opacity='1';}
    if(pf>120){phase=4;dissolve();return;}
  }
  frame++;rafId=requestAnimationFrame(draw);
}

function dissolve(){
  cancelAnimationFrame(rafId);
  document.getElementById('morph-sub').style.opacity='0';
  let alpha=1;
  function fade(){
    ctx.fillStyle='rgba(14,13,12,.065)';ctx.fillRect(0,0,W,H);
    for(const p of parts){
      p.vx+=(Math.random()-.5)*.7;p.vy-=.18+Math.random()*.28;
      p.x+=p.vx;p.y+=p.vy;p.rot+=.05;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.font=`${p.fs}px 'Noto Sans Devanagari','Mangal',sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=toCSS(ACCENT,alpha*.65);ctx.fillText(p.ch,0,0);ctx.restore();
    }
    alpha-=.014;
    if(alpha>0)requestAnimationFrame(fade);
    else ctx.clearRect(0,0,W,H);
  }
  requestAnimationFrame(fade);
}

window.skipAll=function(){cancelAnimationFrame(rafId);ctx.clearRect(0,0,W,H);document.getElementById('morph-sub').style.opacity='0';};
draw();
})();

/* ══════════════════════════════════════════════════
   RESIZE
══════════════════════════════════════════════════ */
window.addEventListener('resize',()=>{
  const s=computeSizes();
  renderer.setSize(s.gs,s.gs);
  camera.updateProjectionMatrix();
});
</script>
